name: Validate banner admin backend

on:
  push:
    branches:
      - feature/home-banner-admin-footer-payments

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, gd
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -l app/Http/Controllers/SettingController.php
      - run: php artisan route:list --path=settings
