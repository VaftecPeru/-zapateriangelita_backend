name: Refresh backend dependencies
on:
  push:
    branches:
      - fix/premerge-fullstack-20260918
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premerge-fullstack-20260918
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, curl, openssl, fileinfo
          tools: composer:v2
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked || true
      - name: Commit dependency refresh
        run: |
          git config user.name "VAFTEC Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar dependencias backend [skip ci]"
            git push origin HEAD:fix/premerge-fullstack-20260918
          fi
