name: Fix postpay autologin final

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/Http/Controllers/CheckoutController.php')
          s = p.read_text()
          old = """        if ($createdUser && $user && $temporaryPassword) {
              try {
                  Mail::to($user->email)->send(new UserCredentialsMail($user, $temporaryPassword, $paidOrder));
              } catch (\\Throwable $e) {
                  Log::error('CHECKOUT_CREDENTIAL_EMAIL_FAILED', [
                      'order_id' => $paidOrder->id,
                      'user_id' => $user->id,
                      'exception' => get_class($e),
                  ]);
              }

              $response['account_created'] = true;
              $response['auth_token'] = $user->createToken('checkout_auto_login')->plainTextToken;
              $response['user'] = $user;
              $response['credentials_sent'] = true;
              return $response;
          }
          """
          new = """        if ($createdUser && $user && $temporaryPassword) {
              // El auto-login no debe esperar al servidor SMTP. La sesión se
              // entrega inmediatamente y el correo se procesa al terminar la respuesta.
              $response['account_created'] = true;
              $response['auth_token'] = $user->createToken('checkout_auto_login')->plainTextToken;
              $response['user'] = $user;
              $response['credentials_delivery'] = 'scheduled';

              $mailUser = $user;
              $mailPassword = $temporaryPassword;
              $mailOrder = $paidOrder;

              app()->terminating(function () use ($mailUser, $mailPassword, $mailOrder) {
                  try {
                      Mail::to($mailUser->email)->send(
                          new UserCredentialsMail($mailUser, $mailPassword, $mailOrder)
                      );
                  } catch (\\Throwable $e) {
                      Log::error('CHECKOUT_CREDENTIAL_EMAIL_FAILED', [
                          'order_id' => $mailOrder->id,
                          'user_id' => $mailUser->id,
                          'exception' => get_class($e),
                      ]);
                  }
              });

              return $response;
          }
          """
          if old not in s:
              raise SystemExit('mail block not found')
          p.write_text(s.replace(old, new, 1))

          r = Path('routes/api.php')
          rs = r.read_text()
          old_route = "    Route::get('/checkout/payments/openpay/verify', [CheckoutController::class, 'verify']);"
          new_route = "    Route::match(['get', 'post'], '/checkout/payments/openpay/verify', [CheckoutController::class, 'verify']);"
          if old_route not in rs:
              raise SystemExit('verify route not found')
          r.write_text(rs.replace(old_route, new_route, 1))
          PY

      - name: Validate PHP
        run: |
          php -l app/Http/Controllers/CheckoutController.php
          php -l routes/api.php
          grep -q "credentials_delivery.*scheduled" app/Http/Controllers/CheckoutController.php
          grep -q "app()->terminating" app/Http/Controllers/CheckoutController.php
          grep -q "auto_login_reissued" app/Http/Controllers/CheckoutController.php

      - name: Commit
        run: |
          git config user.name "VaftecPeru"
          git config user.email "vaftecperusac@gmail.com"
          git add app/Http/Controllers/CheckoutController.php routes/api.php
          git diff --cached --quiet && exit 0
          git commit -m "fix: completar auto-login post pago sin bloqueo por correo"
          git push origin main
