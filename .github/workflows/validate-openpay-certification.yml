name: Validate Openpay certification backend

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l config/openpay.php
      - run: php -l app/Http/Controllers/CheckoutController.php
      - run: php -l app/Http/Controllers/Api/OpenpayController.php
