name: Resolve maintenance dependency lock
on:
  pull_request:
    branches: [develop]
    paths: [.github/workflows/maintenance-lock.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, curl, openssl, fileinfo, zip, gd
          tools: composer:v2
      - name: Resolve patched MIME dependency only
        run: composer update symfony/mime --with-dependencies --minimal-changes --no-interaction --no-progress --no-install --no-scripts
      - name: Emit lockfile diff for review
        run: |
          echo LOCK_DIFF_BEGIN
          git diff -- composer.lock
          echo LOCK_DIFF_END
