name: Validate Spring payment service

on:
  pull_request:
    paths:
      - 'microservices/payment-service/**'
      - 'app/Http/Controllers/CheckoutController.php'
      - 'app/Http/Middleware/VerifyPaymentServiceSignature.php'
      - 'app/Services/PaymentMicroserviceClient.php'
      - 'config/services.php'
      - 'routes/api.php'
      - '.github/workflows/payment-service.yml'
  push:
    branches:
      - main
    paths:
      - 'microservices/payment-service/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: mvn --batch-mode clean verify
