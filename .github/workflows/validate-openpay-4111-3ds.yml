name: Validate Openpay 4111 3DS backend
on:
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l app/Http/Controllers/CheckoutController.php
      - run: php -l config/openpay.php
