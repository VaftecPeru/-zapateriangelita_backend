# SHA fijos del último main auditado (24/11/2026), no del código develop.
# No cambie estos valores sin corroborar main, CI push y artefactos de ambas aplicaciones.
# Este control es solo evidencia GitHub y NO concede autorización de despliegue.
name: Angelita release evidence - GitHub only

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      frontend_main_sha:
        description: "SHA exacto frontend main (40 caracteres)"
        type: string
        required: true
        default: "04d1c04bb97d0d900f3fdff57bd8e26e6c727a3f"
      backend_main_sha:
        description: "SHA exacto backend main (40 caracteres)"
        type: string
        required: true
        default: "fdbf9cdfc21411ba9daf5484f34fc5e1c95ef088"

permissions:
  contents: read
  actions: read

concurrency:
  group: angelita-release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-evidence:
    name: Verify immutable release candidates (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_FRONTEND_SHA: ${{ inputs.frontend_main_sha || '04d1c04bb97d0d900f3fdff57bd8e26e6c727a3f' }}
      EXPECTED_BACKEND_SHA: ${{ inputs.backend_main_sha || 'fdbf9cdfc21411ba9daf5484f34fc5e1c95ef088' }}
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4

      - name: Unit tests (offline / no server)
        run: |
          python3 -m py_compile scripts/release_evidence.py
          python3 -m unittest discover -s tests/ci -p 'test_release_evidence.py' -v

      - name: Validate main SHAs, GitHub Actions and artifact metadata
        run: python3 scripts/release_evidence.py

      # Read-only diagnostic of the newly observed main SHAs. The existing gate
      # remains unchanged and must still pass before the branch is merged.
      - name: Audit observed main candidates (read only, no deploy)
        if: always()
        env:
          EXPECTED_FRONTEND_SHA: "43603170f104ed2c2e6c111eb85465d74029e8f5"
          EXPECTED_BACKEND_SHA: "4732dd8b500756fd73585573b34fa18cb3e48ed4"
        run: |
          mkdir -p "$RUNNER_TEMP/angelita-candidate-audit"
          cd "$RUNNER_TEMP/angelita-candidate-audit"
          python3 "$GITHUB_WORKSPACE/scripts/release_evidence.py"

      - name: Publish audit evidence (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelita-release-evidence-${{ github.run_id }}
          path: release-evidence.json
          if-no-files-found: warn
          retention-days: 14
