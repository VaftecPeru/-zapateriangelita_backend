name: Release readiness - read only

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angelita-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-preflight:
    name: Read-only API and storefront preflight
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile scripts/release_preflight.py

      - name: Probe production without credentials or mutations
        run: python3 scripts/release_preflight.py

      - name: Publish non-sensitive preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelita-readiness-${{ github.run_id }}
          path: release-preflight.json
          if-no-files-found: warn
          retention-days: 14
