name: Validate persistent product images backend
on:
  push:
    branches:
      - fix/persistent-product-images-20260918
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l app/Http/Controllers/ProductController.php
      - run: php -l app/Http/Controllers/MediaController.php
      - run: php -l routes/api.php
      - run: php -l config/filesystems.php
