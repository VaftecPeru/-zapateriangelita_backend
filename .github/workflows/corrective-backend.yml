name: Corrective backend verification
on:
  push:
    branches:
      - fix/premerge-corrective-20260918
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premerge-corrective-20260918
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, curl, openssl, fileinfo
          tools: composer:v2
      - name: Update dependencies within Laravel 10 constraints
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Commit composer lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar dependencias backend compatibles"
            git push origin HEAD:fix/premerge-corrective-20260918
          fi
      - name: PHP syntax
        run: find app routes config database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit --testdox
      - name: Composer security audit
        run: composer audit --locked
        continue-on-error: true
