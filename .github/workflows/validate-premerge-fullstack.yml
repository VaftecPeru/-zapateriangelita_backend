name: Validate corrective backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, curl, openssl, fileinfo
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: PHP syntax check
        run: find app routes config database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare test environment
        run: |
          touch database/database.sqlite
          printf '%s\n' \
            'APP_NAME=AngelitaAudit' \
            'APP_ENV=testing' \
            'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            'APP_DEBUG=false' \
            'APP_URL=http://localhost' \
            'FRONTEND_URL=http://localhost:5173' \
            'LOG_CHANNEL=stderr' \
            'DB_CONNECTION=sqlite' \
            "DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite" \
            'CACHE_STORE=array' \
            'CACHE_DRIVER=array' \
            'SESSION_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=array' \
            'OPENPAY_SANDBOX=true' \
            'OPENPAY_CURRENCY=MXN' \
            'OPENPAY_MERCHANT_ID=test_merchant' \
            'OPENPAY_PUBLIC_KEY=pk_test' \
            'OPENPAY_PRIVATE_KEY=sk_test' \
            'OPENPAY_REDIRECT_URL=https://example.test/checkout' > .env

      - name: Laravel boot
        run: php artisan about

      - name: Validate migrations from zero
        run: php artisan migrate:fresh --force

      - name: Validate routes
        run: php artisan route:list

      - name: Run backend test suite
        run: vendor/bin/phpunit --testdox
