name: Validate corrective backend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'audit/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, bcmath, curl, openssl, fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files '.env' 'bootstrap/cache/config.php' 'backup_*.sql' '*backup*.sql' | tr '\n' ' ')"
          if [ -n "$forbidden" ]; then
            echo "::error::Archivos sensibles/de respaldo versionados: $forbidden"
            exit 1
          fi

      - name: PHP syntax check
        run: find app routes config database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare test environment
        shell: bash
        run: |
          touch database/database.sqlite
          printf '%s\n' \
            'APP_NAME=AngelitaAudit' \
            'APP_ENV=testing' \
            'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
            'APP_DEBUG=false' \
            'APP_URL=http://localhost' \
            'FRONTEND_URL=http://localhost:5173' \
            'LOG_CHANNEL=stderr' \
            'DB_CONNECTION=sqlite' \
            "DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite" \
            'CACHE_STORE=array' \
            'CACHE_DRIVER=array' \
            'SESSION_DRIVER=array' \
            'QUEUE_CONNECTION=sync' \
            'MAIL_MAILER=array' \
            'OPENPAY_SANDBOX=true' \
            'OPENPAY_CURRENCY=MXN' \
            'OPENPAY_MERCHANT_ID=test_merchant' \
            'OPENPAY_PUBLIC_KEY=pk_test' \
            'OPENPAY_PRIVATE_KEY=sk_test' \
            'OPENPAY_REDIRECT_URL=https://example.test/checkout' > .env

      - name: Laravel boot
        run: php artisan about

      - name: Validate migrations from zero
        run: php artisan migrate:fresh --force

      - name: Validate routes
        run: php artisan route:list

      - name: Importer regression tests
        run: php artisan test tests/Feature/ProductInventoryImportTest.php --stop-on-failure

      - name: Run backend test suite
        run: php artisan test

      - name: Upload Laravel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-logs-${{ github.run_id }}
          path: storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
