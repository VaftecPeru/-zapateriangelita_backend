name: Sync composer lock final
on:
  push:
    branches:
      - fix/premerge-fullstack-20260918
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premerge-fullstack-20260918
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer update --lock --no-interaction --no-progress
      - run: composer validate --strict --no-check-publish
      - name: Commit lock synchronization
        run: |
          git config user.name "VAFTEC Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sincronizar composer.lock [skip ci]"
            git push origin HEAD:fix/premerge-fullstack-20260918
          fi
